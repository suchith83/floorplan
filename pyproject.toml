[project]
name = "floorplan"
version = "0.1.0"
description = "Phone capture -> dimensioned floor plan + damage assessment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python-headless",
  "open3d>=0.19",
  "shapely>=2",
  "scikit-image",
  "pyyaml",
  "pillow",
  "modal",
  "huggingface_hub",
  "pydantic>=2.12,<3",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
  "mapanything",
  "pillow-heif>=1.8.0",
  "imageio-ffmpeg>=0.6.0",
  "transformers>=4.57",
]

[project.scripts]
fp = "fp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# numpy + Apple Accelerate: spurious matmul warnings (see fp/__init__.py)
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]

[tool.uv.sources]
mapanything = { git = "https://github.com/facebookresearch/map-anything", rev = "3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9" }
