[project]
name = "floorplan"
version = "0.1.0"
description = "Phone capture -> dimensioned floor plan + damage assessment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python-headless",
  "open3d>=0.19",
  "shapely>=2",
  "scikit-image",
  "pyyaml",
  "pillow",
  "modal",
  "huggingface_hub",
]

[project.scripts]
fp = "fp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# numpy + Apple Accelerate: spurious matmul warnings (see fp/__init__.py)
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
