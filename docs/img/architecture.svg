<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .b{fill:#fff;stroke:#333;stroke-width:1.3}
      .in{fill:#eef3fa;stroke:#4a6fa5;stroke-width:1.2}
      .l{fill:#fff;stroke:#333;stroke-width:1.3;stroke-dasharray:5 3}
      .o{fill:#f2f2f2;stroke:#333;stroke-width:1.3}
      .t{font-size:13px;font-weight:bold;fill:#111}
      .d{font-size:11px;fill:#222}
      .p{font-size:10px;fill:#666;font-family:Menlo, Consolas, monospace}
      .ln{stroke:#333;stroke-width:1.3;fill:none}
    </style>
  </defs>

  <!-- Row 1: inputs -> ingest -> bundle -> recon -> drift -->
  <rect class="in" x="10" y="20" width="140" height="30" rx="4"/>
  <text class="d" x="80" y="39" text-anchor="middle">Stray folder (LiDAR)</text>
  <rect class="in" x="10" y="58" width="140" height="30" rx="4"/>
  <text class="d" x="80" y="77" text-anchor="middle">video .mp4 / .mov</text>
  <rect class="in" x="10" y="96" width="140" height="30" rx="4"/>
  <text class="d" x="80" y="115" text-anchor="middle">photos, 1 folder / room</text>

  <rect class="b" x="180" y="28" width="135" height="90" rx="4"/>
  <text class="t" x="247" y="48" text-anchor="middle">ingest</text>
  <text class="d" x="247" y="66" text-anchor="middle">load_capture():</text>
  <text class="d" x="247" y="80" text-anchor="middle">auto-detect tier,</text>
  <text class="d" x="247" y="94" text-anchor="middle">quality filter</text>
  <text class="p" x="247" y="110" text-anchor="middle">fp/ingest/</text>

  <rect class="b" x="340" y="28" width="130" height="90" rx="4"/>
  <text class="t" x="405" y="48" text-anchor="middle">CaptureBundle</text>
  <text class="d" x="405" y="66" text-anchor="middle">frames, K, time;</text>
  <text class="d" x="405" y="80" text-anchor="middle">poses + depth</text>
  <text class="d" x="405" y="94" text-anchor="middle">if the tier has them</text>
  <text class="p" x="405" y="110" text-anchor="middle">fp/bundle.py</text>

  <rect class="b" x="500" y="10" width="190" height="58" rx="4"/>
  <text class="t" x="595" y="28" text-anchor="middle">recon: LiDAR fuse</text>
  <text class="d" x="595" y="44" text-anchor="middle">back-project depth, conf = 2, 1 cm</text>
  <text class="p" x="595" y="60" text-anchor="middle">fp/recon/lidar_fuse.py</text>

  <rect class="b" x="500" y="78" width="190" height="58" rx="4"/>
  <text class="t" x="595" y="96" text-anchor="middle">recon: MapAnything</text>
  <text class="d" x="595" y="112" text-anchor="middle" style="font-size:10px">learned depth + poses, 24-view chunks</text>
  <text class="p" x="595" y="128" text-anchor="middle">fp/recon/camera.py</text>

  <rect class="l" x="712" y="10" width="186" height="58" rx="4"/>
  <text class="t" x="805" y="28" text-anchor="middle">drift (LiDAR only)</text>
  <text class="d" x="805" y="44" text-anchor="middle">submaps, ICP loops, pose graph</text>
  <text class="p" x="805" y="60" text-anchor="middle">fp/recon/drift.py</text>

  <!-- row 1 arrows -->
  <path class="ln" d="M150,35 L165,35 L165,73 L178,73" marker-end="url(#a)"/>
  <path class="ln" d="M150,73 L178,73"/>
  <path class="ln" d="M150,111 L165,111 L165,73"/>
  <path class="ln" d="M315,73 L338,73" marker-end="url(#a)"/>
  <path class="ln" d="M470,73 L485,73 L485,39 L498,39" marker-end="url(#a)"/>
  <path class="ln" d="M485,73 L485,107 L498,107" marker-end="url(#a)"/>
  <path class="ln" d="M690,39 L710,39" marker-end="url(#a)"/>
  <!-- merge to row 2 -->
  <path class="ln" d="M898,39 L925,39 L925,160"/>
  <path class="ln" d="M690,107 L925,107"/>
  <text class="d" x="808" y="101" text-anchor="middle" fill="#555">video / photos: no drift correction</text>
  <path class="ln" d="M925,160 L72,160 L72,183" marker-end="url(#a)"/>
  <text class="d" x="500" y="154" text-anchor="middle" fill="#555">Recon: points, normals, camera rays, poses</text>

  <!-- Row 2 -->
  <rect class="b" x="13" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="72" y="205" text-anchor="middle">align</text>
  <text class="d" x="72" y="223" text-anchor="middle">gravity, floor,</text>
  <text class="d" x="72" y="237" text-anchor="middle">Manhattan yaw</text>
  <text class="p" x="72" y="275" text-anchor="middle">geometry/align.py</text>

  <rect class="b" x="149" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="208" y="205" text-anchor="middle">plan + rooms</text>
  <text class="d" x="208" y="223" text-anchor="middle">footprint, walls,</text>
  <text class="d" x="208" y="237" text-anchor="middle">watershed split,</text>
  <text class="d" x="208" y="251" text-anchor="middle">connections</text>
  <text class="p" x="208" y="275" text-anchor="middle">plan.py, rooms.py</text>

  <rect class="b" x="285" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="344" y="205" text-anchor="middle">openings,</text>
  <text class="t" x="344" y="220" text-anchor="middle">ceiling</text>
  <text class="d" x="344" y="237" text-anchor="middle">ray votes on wall</text>
  <text class="d" x="344" y="251" text-anchor="middle">grids; ceiling layer</text>
  <text class="p" x="344" y="266" text-anchor="middle">openings.py</text>
  <text class="p" x="344" y="279" text-anchor="middle">ceiling.py</text>

  <rect class="b" x="421" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="480" y="205" text-anchor="middle">damage</text>
  <text class="d" x="480" y="223" text-anchor="middle">DINO + SAM 2.1,</text>
  <text class="d" x="480" y="237" text-anchor="middle">project, 2nd view,</text>
  <text class="d" x="480" y="251" text-anchor="middle">rules C1–C5</text>
  <text class="p" x="480" y="275" text-anchor="middle">fp/damage/</text>

  <rect class="b" x="557" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="616" y="205" text-anchor="middle">scope</text>
  <text class="d" x="616" y="223" text-anchor="middle">line items keyed</text>
  <text class="d" x="616" y="237" text-anchor="middle">to surface IDs,</text>
  <text class="d" x="616" y="251" text-anchor="middle">interval arithmetic</text>
  <text class="p" x="616" y="275" text-anchor="middle">fp/scope.py</text>

  <rect class="b" x="693" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="752" y="205" text-anchor="middle">contract</text>
  <text class="d" x="752" y="223" text-anchor="middle">Measure{value,</text>
  <text class="d" x="752" y="237" text-anchor="middle">lo, hi}; k, b from</text>
  <text class="d" x="752" y="251" text-anchor="middle">calibration.json</text>
  <text class="p" x="752" y="275" text-anchor="middle">fp/contract.py</text>

  <rect class="o" x="829" y="185" width="118" height="100" rx="4"/>
  <text class="t" x="888" y="205" text-anchor="middle">outputs</text>
  <text class="d" x="888" y="223" text-anchor="middle">plan.json (schema)</text>
  <text class="d" x="888" y="237" text-anchor="middle">plan.svg</text>
  <text class="d" x="888" y="251" text-anchor="middle">report.html</text>
  <text class="p" x="888" y="275" text-anchor="middle">fp/report/</text>

  <path class="ln" d="M131,235 L147,235" marker-end="url(#a)"/>
  <path class="ln" d="M267,235 L283,235" marker-end="url(#a)"/>
  <path class="ln" d="M403,235 L419,235" marker-end="url(#a)"/>
  <path class="ln" d="M539,235 L555,235" marker-end="url(#a)"/>
  <path class="ln" d="M675,235 L691,235" marker-end="url(#a)"/>
  <path class="ln" d="M811,235 L827,235" marker-end="url(#a)"/>

  <text class="d" x="13" y="315" fill="#444">One command: uv run fp run &lt;capture&gt;. Dashed box = LiDAR tier only. A stage that fails or is missing writes a warning and observed: false; the plan is still schema-valid.</text>
</svg>
